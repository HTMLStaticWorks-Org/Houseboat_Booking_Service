<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Lagoon &amp; Leaf</title>
  <link rel="icon" type="image/svg+xml" href="assets/boat-mark.svg">
  <script>
    (function () {
      var t = localStorage.getItem('lagoon_theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      var d = localStorage.getItem('lagoon_dir');
      if (d) document.documentElement.setAttribute('dir', d);
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- Fixed Top-Right Theme and RTL controls -->
  <div class="auth-top-controls">
    <button type="button" class="nav-btn nav-btn-rtl" id="rtl-toggle" title="Toggle RTL/LTR"><span class="rtl-text">RTL</span></button>
    <button type="button" class="nav-btn nav-btn-theme" id="theme-toggle" title="Toggle theme"><span class="theme-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span></button>
  </div>

  <main class="auth-page">
    <section class="auth-panel">
      <div class="auth-panel-inner">
        <a class="brand" href="index.html">
          <img src="assets/boat-mark.svg" alt="Lagoon &amp; Leaf Logo">
          <span>Lagoon &amp; Leaf</span>
        </a>

        <h1>Reset password</h1>
        <p>Enter your email and we'll send instructions to reset your password.</p>

        <form data-demo-form>
          <div style="text-align:left;">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required>
          </div>
          <button class="btn btn-cruise" type="submit" style="width:100%; padding:14px; margin-top:16px;">Send reset link</button>
          <div class="notice" role="status"></div>
        </form>

        <div class="auth-bottom">
          <a href="login.html">← Back to sign in</a>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/main.js"></script>
</body>
</html>
