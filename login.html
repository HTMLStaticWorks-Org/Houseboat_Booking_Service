<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Lagoon &amp; Leaf</title>
  <link rel="icon" type="image/svg+xml" href="assets/boat-mark.svg">
  <script>
    (function () {
      var t = localStorage.getItem('lagoon_theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      var d = localStorage.getItem('lagoon_dir');
      if (d) document.documentElement.setAttribute('dir', d);
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- Fixed Top-Right Theme and RTL controls -->
  <div class="auth-top-controls">
    <button type="button" class="nav-btn nav-btn-rtl" id="rtl-toggle" title="Toggle RTL/LTR"><span class="rtl-text">RTL</span></button>
    <button type="button" class="nav-btn nav-btn-theme" id="theme-toggle" title="Toggle theme"><span class="theme-icon">🌙</span></button>
  </div>

  <main class="auth-page">
    <section class="auth-panel">
      <div class="auth-panel-inner">
        <a class="brand" href="index.html">
          <img src="assets/boat-mark.svg" alt="Lagoon &amp; Leaf Logo">
          <span>Lagoon &amp; Leaf</span>
        </a>

        <h1>Welcome back</h1>
        <p>Sign in to continue planning your escape.</p>

        <!-- Social Media Buttons -->
        <div class="auth-social-buttons">
          <button type="button" class="auth-social-btn">
            <svg viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
          <button type="button" class="auth-social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.42c.62-.75 1.04-1.8 1.04-2.85 0-.15-.01-.29-.04-.44-.99.04-2.2.66-2.91 1.49-.55.63-1.03 1.66-1.03 2.73 0 .15.02.29.04.42 1.09.08 2.28-.6 2.9-1.35z"/>
            </svg>
            Continue with Apple
          </button>
          <button type="button" class="auth-social-btn">
            <svg viewBox="0 0 24 24" fill="#1877F2">
              <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
            </svg>
            Continue with Facebook
          </button>
        </div>

        <div class="auth-divider"><span>or sign in with email</span></div>

        <form data-demo-form>
          <div style="text-align:left;">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required>
          </div>

          <div style="text-align:left;">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" type="password" placeholder="Enter your password" required>
              <button class="eye" type="button" data-toggle-password="password" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="auth-meta">
            <label style="display:flex;align-items:center;gap:7px;margin:0;font-weight:500; cursor:pointer;">
              <input type="checkbox" style="width:auto;"> Remember me
            </label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>

          <button class="btn btn-cruise" type="submit" style="width:100%; padding:14px; margin-top:10px;">Sign in</button>
          <div class="notice" role="status"></div>
        </form>

        <div class="auth-bottom">
          New to Lagoon &amp; Leaf? <a href="signup.html">Create an account</a>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/main.js"></script>
</body>
</html>
